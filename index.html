<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>MatchWatch</title>
    <meta name="description" content="Свайп-подбор фильмов для одного и для двоих: совместные комнаты, мгновенные мэтчи и рекомендации по темам, а не по жанрам." />

    <!--
      Превью ссылки — PNG с абсолютным адресом. SVG и относительный путь
      Telegram, ВКонтакте и мессенджеры не показывают вовсе: ссылка на
      приложение уходила голой строкой, без картинки.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MatchWatch" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="MatchWatch — свайпайте кино вдвоём" />
    <meta property="og:description" content="Свайпайте фильмы вдвоём. Совпали — значит, вечер спасён." />
    <meta property="og:image" content="https://matchwatch-seven.vercel.app/brand/og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://matchwatch-seven.vercel.app/brand/og-1200x630.png" />

    <!-- Telegram Mini Apps SDK: должен загрузиться до приложения -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>MatchWatch требует включённого JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
